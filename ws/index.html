        <link rel="apple-touch-icon" href="../apple-touch-icon.png">
        <link rel="stylesheet" type="text/css" href="../css/stylesheet.css">
    </head>
    <body class="page-ws">
        <!-- 独立特效层：背景几何装饰 -->
        <svg class="bg-deco" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <g class="d1">
                <line x1="0" y1="120"  x2="1600" y2="120"  />
                <line x1="0" y1="260"  x2="1600" y2="260"  />
                <line x1="0" y1="420"  x2="1600" y2="420"  />
                <line x1="0" y1="600"  x2="1600" y2="600"  />
                <line x1="0" y1="780"  x2="1600" y2="780"  />
            </g>
            <g class="d2" transform="translate(200,0)">
                <line x1="0" y1="180"  x2="1600" y2="180"  />
                <line x1="0" y1="330"  x2="1600" y2="330"  />
                <line x1="0" y1="500"  x2="1600" y2="500"  />
                <line x1="0" y1="680"  x2="1600" y2="680"  />
                <line x1="0" y1="840"  x2="1600" y2="840"  />
            </g>
            <rect class="d3" x="120"  y="160"  width="60" height="60" rx="10" fill="none" stroke="rgba(0,229,255,0.18)" stroke-width="1.5"/>
            <rect class="d4" x="1420" y="620"  width="80" height="80" rx="14" fill="none" stroke="rgba(47,107,255,0.22)" stroke-width="1.5"/>
            <rect class="d1" x="1380" y="180"  width="36" height="36" rx="8"  fill="none" stroke="rgba(124,58,237,0.20)" stroke-width="1.5"/>
            <rect class="d2" x="180"  y="680"  width="44" height="44" rx="10" fill="none" stroke="rgba(0,229,255,0.16)" stroke-width="1.5"/>
            <g class="d3" stroke="rgba(0,229,255,0.22)" stroke-width="1.2">
                <line x1="340"  y1="220" x2="360"  y2="220"/>
                <line x1="350"  y1="210" x2="350"  y2="230"/>
            </g>
            <g class="d4" stroke="rgba(47,107,255,0.22)" stroke-width="1.2">
                <line x1="1280" y1="460" x2="1300" y2="460"/>
                <line x1="1290" y1="450" x2="1290" y2="470"/>
            </g>
        </svg>

        <!-- 独立特效层：光标光晕 -->
        <div class="cursor-glow" id="cursor-glow"></div>

        <!-- 悬浮目录开关（窄屏/目录过宽时显示） -->
        <button class="ws-menu-toggle" id="ws-menu-toggle" type="button" aria-label="打开目录" aria-expanded="false" aria-controls="ws-nav-panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <line x1="4" y1="7" x2="20" y2="7"/>
                <line x1="4" y1="12" x2="20" y2="12"/>
                <line x1="4" y1="17" x2="20" y2="17"/>
            </svg>
        </button>

        <!-- 主内容：左侧目录 + 右侧宽内容区 -->
        <div class="ws-layout">
            <aside class="ws-sidebar" id="ws-nav-panel">
                <div class="ws-brand">
                    <span class="ws-brand-title">WSMUD2</span>
                    <span class="ws-brand-sub">攻略手册</span>
                </div>
                <nav class="ws-nav" id="ws-nav" aria-label="攻略目录">
                    <div class="ws-nav-loading">目录加载中…</div>
                </nav>
                <a class="btn" href="../">返回首页</a>
            </aside>
            <main class="panel ws-main">
                <article class="ws-doc">
                    <header class="ws-doc-head">
                        <p class="ws-eyebrow" id="ws-eyebrow">武神MUD2手册</p>
                        <h1 class="ws-doc-title" id="ws-doc-title">WSMUD2 攻略</h1>
                    </header>
                    <div class="ws-content" id="ws-content">
                        <div class="ws-skeleton" aria-hidden="true">
                            <span></span><span></span><span></span><span></span>
                        </div>
                    </div>
                </article>
            </main>
        </div>

        <!-- Ctrl+J 标题搜索 -->
        <div class="ws-search" id="ws-search" role="dialog" aria-modal="true" aria-label="搜索攻略标题">
            <div class="ws-search-backdrop" data-search-close></div>
            <div class="ws-search-panel">
                <div class="ws-search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                    </svg>
                    <input id="ws-search-input" type="text" placeholder="搜索攻略标题…" autocomplete="off" spellcheck="false" aria-label="搜索攻略标题">
                    <kbd>Esc</kbd>
                </div>
                <div class="ws-search-results" id="ws-search-results" role="listbox"></div>
                <p class="ws-search-hint">Ctrl+J 打开 · ↑↓ 选择 · Enter 跳转</p>
            </div>
        </div>

        <script>
            /* 光标光晕（rAF 缓动跟随） */
            (function () {
                const glow = document.getElementById('cursor-glow');
                if (!glow) return;

                let targetX = window.innerWidth / 2;
                let targetY = window.innerHeight / 2;
                let curX = targetX, curY = targetY;

                document.addEventListener('mousemove', function (e) {
                    targetX = e.clientX;
                    targetY = e.clientY;
                });

                function tick() {
                    curX += (targetX - curX) * 0.14;
                    curY += (targetY - curY) * 0.14;
                    glow.style.transform = 'translate(' + curX + 'px, ' + curY + 'px) translate(-50%, -50%)';
                    requestAnimationFrame(tick);
                }
                requestAnimationFrame(tick);
            })();
        </script>
        <script src="ws.js"></script>
    </body>
</html>
