<ws-p>以下是<span class="is-bold" style="color:rgb(216,57,49)">九阴血刀六脉（刚需，轻功可补惊鸿）</span>杀手打老徐和邪剑仙的攻略。</ws-p><ws-p>准备30+黄喜宴，面板如下：</ws-p><figure class="ws-figure"><img src="assets/OBMqb5V4GoNbYDxeHBUcglRfn2f.jpg" alt="攻略配图" width="383" height="850" loading="lazy"></figure>
<figure class="ws-figure"><img src="assets/SH5Nbqt39ov9unxHQy1cHFOgnyd.jpg" alt="攻略配图" width="383" height="852" loading="lazy"></figure>
<figure class="ws-figure"><img src="assets/E6ePbyGHhodGdSx6kWIcvvE3nKc.jpg" alt="攻略配图" width="383" height="852" loading="lazy"></figure>
<ws-p>命中可以低点，只要保证大部分技能能命中。</ws-p><ws-p>入战打法：先比试骗出酒神咒，记住其它技能时机，秒开嗜血九阴定影，接着六脉落花血刀，看他放了4个技能放移花（必定挡住一次酒神），移花挡住酒神后，昏迷拖技能冷却，直到六脉落花血刀再打一套，一般这个时候三九的被动破了，可以打出伤害了，这个时间注意血量，如果血刀能吸到血最好，不行看自己的坦度吃喜宴，接着等待九阴血刀cd，并看时机用移花挡第二个酒神（没挡住没救了，重来吧），到这步boss只有半血左右了，正常九血昏迷秒掉，结束。</ws-p><ws-p>                                                                   五区杀手暗淡</ws-p><ws-source href="https://ucn595zz2fou.feishu.cn/wiki/ETe6wP72ziGU6wk5b8wcCQiSnOb"></ws-source>
