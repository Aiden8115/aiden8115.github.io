<ws-p>面板：<span class="is-bold">3w命中</span>（仅供参考）</ws-p><ws-p>武当很轻松的本，没什么好说的，进去就是和老祖抢人头，然后无缝缠，血刀老祖没什么忙乱抗性，<span class="is-bold" style="color:rgb(216,57,49)">橙真武剑</span>+<span class="is-bold" style="color:rgb(216,57,49)">橙真武头</span>+<span class="is-bold" style="color:rgb(36,91,219)">紫真武手</span>+<span class="is-bold">副本冷却散件</span>+<span class="is-bold">任意颜色归元散</span>/<span class="is-bold">玄灵</span>就能无缝（或<span class="is-bold" style="color:rgb(216,57,49)">橙手</span>），只要层数不高，连字诀打的中就能磨，内功推荐带<span class="is-bold" style="color:rgb(36,91,219)">明玉</span>提速，招架可以带<span class="is-bold" style="color:rgb(36,91,219)">移花</span>或者<span class="is-bold" style="color:rgb(36,91,219)">进阶五神剑</span>。</ws-p><ws-source href="https://ucn595zz2fou.feishu.cn/wiki/P7j9wSKlSiQIMbkLkGWc7EKSnoc"></ws-source>
