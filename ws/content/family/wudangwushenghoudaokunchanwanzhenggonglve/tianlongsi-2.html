<ws-p>面板：buff后<span class="is-bold">7-8w招架（大概2件招架橙装，</span><span class="is-bold" style="color:rgb(216,57,49)">真武剑</span><span class="is-bold">+</span><span class="is-bold" style="color:rgb(216,57,49)">真武衣服/真武腰带</span><span class="is-bold">）</span></ws-p><ws-p>需要阿朱面具伪装里面的人混进去，在未1V6之前所遇到的和尚一个也不能杀，杀了会影响1V6这个6人的条件。</ws-p><ws-p>牟尼堂会看到枯荣大师和段誉，先比试枯荣，在枯荣快认输时（大约80w血），放一个高伤害技能，将枯荣的血打的越少越好，接着速度抓段誉，然后放其他技能击杀枯荣。</ws-p><ws-p>Buff后有7-8w招架，背负之后靠星移一套把枯荣弹死，弹死枯荣之后剩几个和尚伤害不高，可以缠+喜宴慢慢耗，如果有蛇步的话生存压力会小一点，暗影接连字诀也能出伤害，能加速一下流程。</ws-p><ws-p>总体来说，武当打天龙寺不难。</ws-p><ws-source href="https://ucn595zz2fou.feishu.cn/wiki/D7xtwdQrficF41k0mkAcJYqFnCe"></ws-source>
