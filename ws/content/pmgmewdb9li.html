<p class="ws-p">按理来说，打到这的武当是随便打这个本，王重阳等他开逆转九阴的时候再去缠他就行，有蛇步可以无缝缠，这本没啥难度。</p>
<p class="ws-p"><span class="is-bold">推荐刷取</span>：<span class="is-bold" style="color:rgb(216,57,49)">九阴神功</span><span class="is-bold">（每天20次刷刷）</span></p>
