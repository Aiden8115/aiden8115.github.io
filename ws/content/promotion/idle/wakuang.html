<ws-p>早点开蓬莱相信线，这样就能领取<span style="color:rgb(220,155,4)">矿工套</span>、<span style="color:rgb(46,161,33)">观山诀碎片</span>、<span style="color:rgb(46,161,33)">临水经碎片</span>。10片碎片合成秘籍。秘籍给了随从，随从练习到100级可以在房子里挖矿。1个随从1天能挖500左右玄晶，玄晶精炼装备可极大提升战力</ws-p><ws-p><span style="color:rgb(36,91,219)">蓝镐</span>、<span style="color:rgb(220,155,4)">黄镐</span>、<span style="color:rgb(100,37,208)">紫镐</span></ws-p><ws-p>无精炼情况下挖矿1天获取的玄晶、宝石数量差的不是很多</ws-p><ws-source href="https://ucn595zz2fou.feishu.cn/wiki/Kc3LwoXDHiQu3bkp7Phc6GPFnpf"></ws-source>
