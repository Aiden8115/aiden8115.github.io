<h2 class="ws-h1">需要面板</h2>
<p class="ws-p">攻击6500、气血10万</p>
<h2 class="ws-h1">掉落</h2>
<p class="ws-p">掉落踏歌行残页、摧心掌残页、松风剑法残页</p>
<h2 class="ws-h1">攻略内容</h2>
<p class="ws-p">杀死余沧海过关。余沧海难度和田伯光差不多，但是余沧海的输出是不稳定的，前面打你不疼，如果运气不好他一直不用技能，叠十多层松风的时候突然一下使用技能，威力就不同凡响了。</p>
<h2 class="ws-h1">推荐刷取</h2>
<p class="ws-p">踏歌行（前期唯一一个加攻击轻功，出率高值得练），松风剑法散人可以考虑刷，需要配合六扇门千里追风使用，我有一个寒冰松风追风的散人打法，也可以玩到武圣</p>
