<p class="ws-p">面板要求</p>
<p class="ws-p">40w攻击</p>
<p class="ws-p">能打中天僧</p>
<p class="ws-p">武学要求</p>
<p class="ws-p">一指禅（必需品），九血，移花，任意轻功。</p>
<p class="ws-p">先开九血爆砍接移花，等7s后一指禅，一指禅后继续输出，最后血刀收尾，如果打不死就拼运气，追魂有概率能叠6层，那时候必过。</p>
