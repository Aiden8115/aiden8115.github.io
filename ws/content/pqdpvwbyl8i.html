<h2 class="ws-h1">需要面板</h2>
<p class="ws-p">攻击1000、命中1000、招架950、气血12000</p>
<h2 class="ws-h1">掉落</h2>
<p class="ws-p">掉落神龙心法残页、意形步法残页、蛇岛奇功残页、神龙剑残页、化骨绵掌残页、神龙袍、神龙冠、神龙靴、神龙护腕、神龙腰带、神龙杖、神龙令</p>
<h2 class="ws-h1">攻略内容</h2>
<p class="ws-p">进入副本首先一路杀死毒蛇并劈开灌木，然后杀死所有npc通关。注意最后的boss是三人组，可以先比试洪安通，赢了比试马上击杀洪安通。</p>
<h2 class="ws-h1">推荐刷取</h2>
<p class="ws-p">蛇岛奇功（前期凑面板非常好用），神龙腰带（打坐），神龙令（悟性）</p>
