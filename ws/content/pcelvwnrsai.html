<p class="ws-p">你能过古墓那就没问题。</p>
<p class="ws-p">前四个：缠夺魄，没了，两个之间开移花增加容错，欧阳锋吸气不要控，等他喷完，反正不痛。</p>
<p class="ws-p">王重阳：他开九阴你就控一套，CD没好就移花凌波，丢蛇锥，无相借三连环补伤害，但不要学，残了吃大还丹/喜宴</p>
