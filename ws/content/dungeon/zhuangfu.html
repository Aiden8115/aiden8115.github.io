<h2 class="ws-h1">需要面板</h2>
<ws-p>命中200、招架400、基础内功170级</ws-p><h2 class="ws-h1">掉落</h2>
<ws-p>掉落神龙心法残页、意形步法残页、神龙剑残页</ws-p><h2 class="ws-h1">攻略内容</h2>
<ws-p>在大门处可以选择破门进入或是翻墙进入。破门需要一定的内力；翻墙需要一定基本轻功。 进入后杀死神龙教的喽啰，最后见到庄夫人和双儿，可以不击杀。 每给予庄夫人一个吴之荣的头颅（下一关掉落），可以获得一页华山剑法残页。 容貌达到40并给予一个吴之荣的头颅，可以将双儿领走。</ws-p><h2 class="ws-h1">推荐刷取</h2>
<ws-p>无</ws-p><ws-source href="https://ucn595zz2fou.feishu.cn/wiki/I1n3wTGIgibv9skE0Vvc2kWqnId"></ws-source>
