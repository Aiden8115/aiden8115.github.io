<h2 class="ws-h1">需要面板</h2>
<p class="ws-p">华山（攻击命中5000）、丐帮（攻击命中高于5000）、武当少林峨眉逍遥（攻击命中低于5000）</p>
<h2 class="ws-h1">掉落</h2>
<p class="ws-p">掉落五毒神功残页、五毒烟萝步残页、五毒钩法残页、千蛛万毒手残页、疤面面具、金吴钩</p>
<h2 class="ws-h1">攻略内容</h2>
<p class="ws-p">沿路杀死所有npc，1V3那关会比较难，你切磋一个，叫杀切磋杀的是另一个，然后被切磋的那个一定排最后，所以这关1V3没有骚操作，另外何铁手（金吴钩是这个npc掉落，疤面面具是何红药掉落）不杀。完成度100%。</p>
<h2 class="ws-h1">推荐刷取</h2>
<p class="ws-p">疤面面具（13终伤，用到关服）</p>
