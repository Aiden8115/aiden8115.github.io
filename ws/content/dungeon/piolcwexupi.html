<h2 class="ws-h1">需要面板</h2>
<p class="ws-p">命中200、招架400、基础内功170级（这里命中只要180）</p>
<h2 class="ws-h1">掉落</h2>
<p class="ws-p">掉落基本刀法秘籍、基本剑法秘籍、将军剑、军刀、军服、齐眉棍、官服</p>
<h2 class="ws-h1">攻略内容</h2>
<p class="ws-p">沿路杀死所有官兵武将，在扬州守备处可以进入武器库（需要30臂力），进去后可以搜索获得大量物资，每24小时重置一次搜索。</p>
<h2 class="ws-h1">推荐刷取</h2>
<p class="ws-p">无</p>
