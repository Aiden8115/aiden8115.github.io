<h2 class="ws-h1">需要面板</h2>
<ws-p>命中60-100、招架210</ws-p><h2 class="ws-h1">掉落</h2>
<ws-p>掉落流氓巾、流氓衣、流氓鞋、流氓护腕、流氓短剑、流氓闷棍、千斤拳、基本内功秘籍、基本拳脚秘籍、太祖长拳残页、基本招架秘籍、基本轻功秘籍</ws-p><h2 class="ws-h1">攻略内容</h2>
<ws-p>命中60-100、招架210沿路解决所有流氓，流氓头会叫两个流氓助战（60命中已经可以概率击中流氓但不能确保打到两个boss),最后击杀赵三拳完成副本。流氓巷的仓库暂未开放，推石磨可以缓慢练习自己的基本拳脚。</ws-p><h2 class="ws-h1">推荐刷取</h2>
<ws-p>无</ws-p><ws-source href="https://ucn595zz2fou.feishu.cn/wiki/PUWuwLYuuicbjRkICkCcwaulnOh"></ws-source>
