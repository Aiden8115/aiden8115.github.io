<p class="ws-p">先走365里路进门</p>
<p class="ws-p">然后爆掉浪翻云，用九血以及高伤害技能</p>
<p class="ws-p">接着进岛</p>
<p class="ws-p">用3普度</p>
<p class="ws-p">直接硬打庞斑三条命</p>
<p class="ws-p">结束后进石洞选第二个，结束了。</p>
<p class="ws-p">面板</p>
<p class="ws-p">30w攻击40w命中</p>
<p class="ws-p">打浪要拼运气，拼他别开覆雨剑法，然后直接3s爆死就行，浪的出招是2.5s。</p>
<p class="ws-p">打庞斑要小心拳罡和种魔，然后靠血刀回血。</p>
<p class="ws-p">武功推荐</p>
<p class="ws-p">九血五神暗影经典四件套</p>
<p class="ws-p">拳脚六麦最好</p>
<p class="ws-p">第二穿心掌</p>
<p class="ws-p">最次是神照经</p>
<p class="ws-p">注意：庞的暴击率60%-80%</p>
