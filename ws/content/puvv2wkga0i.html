<h2 class="ws-h1">峨眉简单方法打小楼</h2>
<h3 class="ws-h2">前置配置要求</h3>
<h4 class="ws-h3">所需技能</h4>
<p class="ws-p">十二庄，九爪，血刀，暗影，五神</p>
<h4 class="ws-h3">属性与装备要求</h4>
<ul class="ws-list"><li class="ws-li"><span class="is-bold">裸命中</span>：12.5，示例配置为2300暗影，2000五神</li>
<li class="ws-li"><span class="is-bold">气血</span>：500万</li>
<li class="ws-li"><span class="is-bold">免伤装备</span>：少林衣服，真武鞋</li>
</ul>
<p class="ws-p">理论上把五神和暗影练高点，裸命中要求可以更低</p>
<p class="ws-p">如果命中不够也可以用黯然，但是要磨很久，太折磨了</p>
<h3 class="ws-h2">打法流程</h3>
<p class="ws-p">前面正常拿草，然后开打小楼</p>
<p class="ws-p"><span class="is-bold">核心要点</span>：有鹤翔就开，注意补天过去立马开嗜血，暗影，五神，磨点血</p>
<p class="ws-p">一直慢慢磨到夺魄能昏迷，之后就可以随便打了，直接用九爪输出即可</p>
