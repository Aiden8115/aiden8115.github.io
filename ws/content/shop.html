<p class="ws-p">黄金购买</p>
<p class="ws-p">1、<span style="color:rgb(36,91,219)">扫荡符</span>和<span style="color:rgb(220,155,4)">天师符</span>，15岁时打一折，每增加一岁，多一折，有钱的话建议打折期间每天买满</p>
<p class="ws-p">2、<span style="color:rgb(46,161,33)">背包扩充石</span>、<span style="color:rgb(46,161,33)">仓库扩充石</span>、<span style="color:rgb(220,155,4)">洗髓丹</span>、<span style="color:rgb(36,91,219)">改名符</span><span style="color:rgb(220,155,4)">、</span><span style="color:rgb(222,120,2)">变性丹</span>，一周可买一次，背包最大100格，仓库最大400格。背包扩充石可以给随从</p>
<p class="ws-p">3、<span style="color:rgb(222,120,2)">叛师符、变性丹</span>只能用黄金买一次</p>
<p class="ws-p">4、<span style="color:rgb(222,120,2)">随从礼包</span>，一周可以买一次，最多买20次</p>
<p class="ws-p">5、节假日期间会有新商品，且根据你通过的副本情况打折</p>
<p class="ws-p">元宝购买</p>
<p class="ws-p">1、前期豪宅和随从可以买，性价比较高</p>
