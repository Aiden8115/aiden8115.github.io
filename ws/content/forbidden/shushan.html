<ws-p>蜀山攻略</ws-p><ws-p>流程:</ws-p><ws-p>先进副本把1-4层小怪干掉，拿到两个任务物品，然后出去找李三思和司徒？，把任务物品给他们，点击强化让他们留一口气在身上。</ws-p><ws-p>再次进入副本，记住1-4层小怪位置(九宫格)，然后第五层记住裂缝的位置，到第六层触发剧情单挑邪剑仙，打残触发徐长卿助战(助的是邪剑仙)，死掉复活，先击杀徐长卿，打死再杀邪剑仙，开启八卦阵，把1-5层记住的位置依次点击八卦图，天妖皇出现，干掉他，回塔底，100%完成。</ws-p><ws-source href="https://ucn595zz2fou.feishu.cn/wiki/GGmmwSIGtijiqNk12R3cO5aJnQh"></ws-source>
