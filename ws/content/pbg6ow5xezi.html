<p class="ws-p">面板命中3.6，攻击3.4，躲闪1.19</p>
<p class="ws-p">木头人比试开杀神祝融，进来直接两落花秒不平，乌老大，，再去杀卓不凡，然后比试童佬开鹤翔踏雪，上下走一步，背童姥过桥，立马换五神祝融，起手穿心，然后就赌童姥开不开凌波</p>
<p class="ws-p">我用的大嵩样，穿心没进阶，控制不稳定，比试童佬时要先开鹤翔，快结速时再开踏雪，这样到了李秋水那里五神可以冷却好，这里可以赌一下童姥先开凌波，等凌波快结速再控李秋水，运气好童佬起手凌波，基本就稳了，祝融斩杀，两落花，凌波快结速再控李秋水，</p>
