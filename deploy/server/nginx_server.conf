server {
    listen 80;
    server_name server.aiden8115.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name server.aiden8115.cn;

    ssl_certificate     /etc/letsencrypt/live/server.aiden8115.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.aiden8115.cn/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    root /var/www/html;

    # —— 禁止直接访问 .php 源码 ——
    location ~* \.php$ { deny all; }

    # —— API: MCDownloader 下载 ——
    location = /api/download/mcdownloader {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/aiden8115/api/download/mcdownloader.php;
        fastcgi_param SCRIPT_NAME     /var/www/aiden8115/api/download/mcdownloader.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/aiden8115;
        fastcgi_buffering off;
        fastcgi_read_timeout 300;
        sendfile on;
        tcp_nopush on;
    }

    # —— 现有公开下载目录 ——
    location /download/ {
        root /var/www;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
